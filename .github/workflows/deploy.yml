# Cloud deploy (needs EC2 port 22 open to GitHub Actions — often blocked).
# Prefer deploy-self-hosted.yml once a runner is installed on EC2.
name: Deploy to EC2

on:
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Build on GitHub and deploy pre-built app to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_ENABLE_CHAT: ${{ secrets.NEXT_PUBLIC_ENABLE_CHAT }}
        run: |
          chmod +x scripts/ci-deploy.sh scripts/push-built-to-server.sh scripts/deploy-on-ec2.sh
          export NEXTAUTH_URL="${NEXTAUTH_URL:-https://bihospharma.com}"
          export NEXT_PUBLIC_SITE_URL="${NEXT_PUBLIC_SITE_URL:-https://bihospharma.com}"
          export NEXT_PUBLIC_ENABLE_CHAT="${NEXT_PUBLIC_ENABLE_CHAT:-true}"
          bash scripts/ci-deploy.sh

      - name: Verify public site
        run: |
          for i in 1 2 3 4 5; do
            if curl -sfI "https://bihospharma.com" | head -1 | grep -q "200"; then
              echo "✓ https://bihospharma.com is up"
              exit 0
            fi
            sleep 5
          done
          echo "❌ Site did not return 200 after deploy"
          exit 1
