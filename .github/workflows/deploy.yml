name: Deploy to EC2

on:
  workflow_dispatch:
  # Optional: uncomment to auto-deploy on push (builds on GitHub runner, never on EC2)
  # push:
  #   branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build locally on CI and push to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          chmod +x scripts/ci-deploy.sh scripts/push-built-to-server.sh
          bash scripts/ci-deploy.sh
